<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/projectStyle.css">
    <title>Projects - Portfolio</title>
</head>
<body>
    <div class="container">
        <!-- Sidebar avec navigation et filtres -->
        <div class="sidebar-section">
            <div class="menu-sidebar">
                <nav class="sidebar">
                    <ul>
                        <li><a href="index.html">Home</a></li>
                        <li><a href="projects.html">Projects</a></li>
                        <li><a href="about.html">Info</a></li>
                        <li><a href="contact.html">Contact</a></li>
                    </ul>
                </nav>
            </div>
            
            <div class="filters-section">
                <h2>Filtrer par :</h2>
                <div class="filter-buttons">
                    <button class="filter-btn reset-btn active" onclick="resetFilters()">Tous</button>
                    <button class="filter-btn" data-filter="stage">Stage</button>
                    <button class="filter-btn" data-filter="perso">Perso</button>
                    <button class="filter-btn" data-filter="team">Team</button>
                    <button class="filter-btn" data-filter="web">Web</button>
                    <button class="filter-btn" data-filter="python">Python</button>
                    <button class="filter-btn" data-filter="cms">CMS</button>
                    
                </div>
            </div>
            
            <div class="project-count">
                <p id="project-counter">5 projets</p>
            </div>
        </div>

        <!-- Zone principale avec grille de projets -->
        <div class="main-section">
            <h1>Mes Projets</h1>
            
            <div class="projects-grid" id="projects-grid">
                <!-- Les cartes de projets seront générées ici -->
            </div>
        </div>
    </div>

    <div class="theme-switch">
        <span>Light</span>
        <label class="switch">
            <input type="checkbox" id="theme-toggle">
            <span class="slider"></span>
        </label>
        <span>Dark</span>
    </div>
    
    <footer class="droits-reserves">
        <p>&copy;2025 ROLLAND Baptiste. Tous droits réservés.</p>
    </footer>

    <script src="js/switchTheme.js"></script>
    <script src="js/particles.js"></script>
    
    <script>
        // Données des projets
        const projectsData = {
            "projects": [
                {
                    "id": 5,
                    "name": "Projet Cocktail",
                    "date": "2025-03-17",
                    "categories": ["stage", "web"],
                    "description": "Stage de fin d'étude : Remise en état du projet cocktail",
                    "featured_image": "project-cocktail/Cocktail_Etude.jpeg"
                },
                {
                    "id": 4,
                    "name": "Site Portfolio Personnel",
                    "date": "2024-11-20",
                    "categories": ["perso", "web"],
                    "description": "Site web responsive pour présenter mes projets et compétences",
                    "featured_image": "project-portfolio/portfolio-index.png"
                },
                {
                    "id": 3,
                    "name": "Application Mini-Jeux Python",
                    "date": "2024-11-05",
                    "categories": ["perso", "python"],
                    "description": "Collection de mini-jeux développée en Python avec interface graphique",
                    "featured_image": "project-miniJeux/miniJeux-accueil.png"
                },
                {
                    "id": 2,
                    "name": "Site Web Talc Mexicain",
                    "date": "2024-12-01",
                    "categories": ["perso", "web", "team"],
                    "description": "Site web personnalisé développé de zéro pour l'équipe du TalcMexicain",
                    "featured_image": "project-talcMexicain/logo-talc.png"
                },
                {
                    "id": 1,
                    "name": "Site Web C2RB",
                    "date": "2024-02-01",
                    "categories": ["stage", "cms"],
                    "description": "Stage de 2ème année : Site du C2RB développé avec WordPress",
                    "featured_image": "project-c2rb/logo-c2rb.png"
                }
            ]
        };

        // Variables globales
        let activeFilters = [];

        // Initialisation
        document.addEventListener('DOMContentLoaded', function() {
            renderProjects();
            initializeEventListeners();
            updateProjectCounter();
        });

        // Rendu des projets
        function renderProjects() {
            const grid = document.getElementById('projects-grid');
            const filteredProjects = filterProjects();
            
            grid.innerHTML = '';
            
            if (filteredProjects.length === 0) {
                grid.innerHTML = '<div class="no-results">Aucun projet trouvé</div>';
                updateProjectCounter(0);
                return;
            }
            
            filteredProjects.forEach(project => {
                const projectCard = createProjectCard(project);
                grid.appendChild(projectCard);
            });
            
            updateProjectCounter(filteredProjects.length);
        }

        // Création d'une carte projet
        function createProjectCard(project) {
            const card = document.createElement('div');
            card.className = 'project-card';
            card.setAttribute('data-categories', project.categories.join(','));
            
            card.innerHTML = `
                <div class="card-image">
                    <img src="uploads/${project.featured_image}" alt="${project.name}" 
                         onerror="this.src='data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAwIiBoZWlnaHQ9IjE1MCIgdmlld0JveD0iMCAwIDIwMCAxNTAiIGZpbGw9Im5vbmUiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PHJlY3Qgd2lkdGg9IjIwMCIgaGVpZ2h0PSIxNTAiIGZpbGw9IiNmNWY1ZjUiLz48dGV4dCB4PSI1MCUiIHk9IjUwJSIgZG9taW5hbnQtYmFzZWxpbmU9Im1pZGRsZSIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZmlsbD0iIzk5OTk5OSI+SW1hZ2UgaW5kaXNwb25pYmxlPC90ZXh0Pjwvc3ZnPg=='">
                </div>
                <div class="card-content">
                    <h3 class="card-title">${project.name}</h3>
                    <p class="card-date">${formatDate(project.date)}</p>
                    <p class="card-description">${project.description}</p>
                    <div class="card-categories">
                        ${project.categories.map(cat => `<span class="category-tag">${cat}</span>`).join('')}
                    </div>
                    <button class="view-details-btn" onclick="goToProject(${project.id})">Voir les détails</button>
                </div>
            `;
            
            return card;
        }

        // Filtrage des projets avec support pour filtres multiples
        function filterProjects() {
            if (activeFilters.length === 0) {
                return projectsData.projects;
            }
            
            return projectsData.projects.filter(project => {
                // Le projet doit avoir au moins une catégorie qui correspond à un filtre actif
                return activeFilters.some(filter => project.categories.includes(filter));
            });
        }

        // Gestion des filtres multiples
        function toggleFilter(filterValue) {
            const index = activeFilters.indexOf(filterValue);
            
            if (index === -1) {
                // Ajouter le filtre
                activeFilters.push(filterValue);
            } else {
                // Retirer le filtre
                activeFilters.splice(index, 1);
            }
            
            updateFilterButtons();
            renderProjects();
        }

        // Réinitialiser tous les filtres
        function resetFilters() {
            activeFilters = [];
            updateFilterButtons();
            renderProjects();
        }

        // Mettre à jour l'apparence des boutons de filtre
        function updateFilterButtons() {
            const allButtons = document.querySelectorAll('.filter-btn');
            const resetButton = document.querySelector('.reset-btn');
            
            // Réinitialiser tous les boutons
            allButtons.forEach(btn => btn.classList.remove('active'));
            
            if (activeFilters.length === 0) {
                // Si aucun filtre actif, activer le bouton "Tous"
                resetButton.classList.add('active');
            } else {
                // Activer les boutons correspondant aux filtres actifs
                activeFilters.forEach(filter => {
                    const button = document.querySelector(`[data-filter="${filter}"]`);
                    if (button) {
                        button.classList.add('active');
                    }
                });
            }
        }

        // Mise à jour du compteur de projets
        function updateProjectCounter(count = null) {
            const counter = document.getElementById('project-counter');
            const totalCount = count !== null ? count : filterProjects().length;
            counter.textContent = `${totalCount} projet${totalCount > 1 ? 's' : ''}`;
        }

        // Navigation vers la page du projet
        function goToProject(projectId) {
            const projectPages = {
                5: 'project/project-cocktail.html',
                4: 'project/project-portfolio.html',
                3: 'project/project-minijeux.html',
                2: 'project/project-talcmexicain.html',
                1: 'project/project-c2rb.html'
            };
            
            const projectPage = projectPages[projectId];
            if (projectPage) {
                window.location.href = projectPage;
            }
        }

        // Formatage des dates
        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('fr-FR', { 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric' 
            });
        }

        // Initialisation des event listeners
        function initializeEventListeners() {
            // Filtres (excluant le bouton reset)
            document.querySelectorAll('.filter-btn:not(.reset-btn)').forEach(btn => {
                btn.addEventListener('click', function() {
                    const filterValue = this.getAttribute('data-filter');
                    toggleFilter(filterValue);
                });
            });
        }
    </script>
</body>
</html>
